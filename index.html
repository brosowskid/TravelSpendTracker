  <div class="card">
    <div class="h2">🗑️ ${tr("Aufräumen")}</div>
    <button class="btn danger" onclick="deleteTrip('${t.id}')">${tr("Reise löschen")}</button>
  </div>`;
}
function updateTripName(v) {
  const t = editingTrip(); if (!t) return;
  if (!v.trim()) { toast(tr("Name darf nicht leer sein")); render(); return; }
  t.name = v.trim(); saveState(); render();
}
function updateTripBudget(v) {
  const t = editingTrip(); if (!t) return;
  t.budget = parseFloat(v) || 0; checkBudgetWarning(t); saveState(); render();
}
function updateTripDate(field, v) {
  const t = editingTrip(); if (!t) return;
  if (field === "endDate" && v && t.startDate && v < t.startDate) { toast(tr("Enddatum liegt vor dem Startdatum")); render(); return; }
  if (field === "startDate" && v && t.endDate && t.endDate < v) { toast(tr("Startdatum liegt nach dem Enddatum")); render(); return; }
  if (field === "startDate" && !v) { render(); return; } /* a trip always needs a start date */
  t[field] = v || null; saveState(); render();
}

function viewAddTrip() {
  tripCountrySel = []; /* fresh form — safe: this view never re-renders while open */
  return `
  <div class="topbar">
    ${state.trips.length ? `<button class="btn ghost" style="width:auto;padding:6px 2px;" onclick="go('trips')">✕</button>` : ""}
    <div class="h1">${tr("Neue Reise")}</div><span style="width:30px"></span>
  </div>
  <div class="card">
    <label class="field"><span>${tr("Name der Reise")}</span><input id="tripName" placeholder="${tr("z. B. Mexiko 2026")}"></label>
    <label class="field" style="margin-bottom:6px;"><span>${tr("Reiseziele (optional)")}</span></label>
    <div id="tripCountryList">${newTripCountriesHTML()}</div>
    <button class="btn ghost" onclick="openCountrySheet()" style="margin-bottom:12px;">${tr("+ Reiseziel hinzufügen")}</button>
    <label class="field"><span>${tr("Budget in {c} (optional)", { c: esc(state.homeCurrency) })}</span><input id="tripBudget" type="number" inputmode="decimal" placeholder="${tr("z. B. 3500")}"></label>
    <label class="field"><span>${tr("Startdatum")}</span><input id="tripStart" type="date" value="${todayISO()}"></label>
    <label class="field"><span>${tr("Enddatum (optional)")}</span><input id="tripEnd" type="date"></label>
    <button class="btn" onclick="createTrip()">${tr("Reise anlegen")}</button>
  </div>`;
}
function createTrip() {
  const name = $("#tripName").value.trim();
  if (!name) { toast(tr("Bitte einen Namen eingeben")); return; }
  const budget = parseFloat($("#tripBudget").value) || 0;
  const countries = tripCountrySel.slice();
  const startDate = $("#tripStart").value || todayISO();
  const endDate = $("#tripEnd").value || null;
  if (endDate && endDate < startDate) { toast(tr("Enddatum liegt vor dem Startdatum")); return; }
  const trip = { id: uid(), name, budget, startDate, endDate,
    country: countries.length ? countries[0].name : null,
    currency: countries.length ? countries[0].cur : state.homeCurrency,
    countries,
    travelers: ["Ich"], createdAt: new Date().toISOString(), expenses: [] };
  state.trips.push(trip);
  state.activeTripId = trip.id;
  saveState(); toast(tr("Reise angelegt ✓")); go("home");
}
function deleteTrip(id) {
  const t = state.trips.find(x => x.id === id);
  if (!t) return;
  if (!confirm(tr("Reise „{n}\" mit {x} Ausgaben wirklich löschen?", { n: t.name, x: (t.expenses || []).length }))) return;
  state.trips = state.trips.filter(x => x.id !== id);
  if (state.activeTripId === id) state.activeTripId = state.trips.length ? state.trips[0].id : null;
  saveState();
  if (state.ui.view === "trip-edit") { editingTripId = null; go("trips"); } else render();
}

/* ----- More / settings / export ----- */
function viewMore() {
  const trip = activeTrip();
  return `
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:10px; min-width:0;">
      <button class="icon-btn" onclick="goBack()" aria-label="${tr("Zurück")}" style="font-size:22px;">‹</button>
      <div class="title">${tr("Einstellungen")}</div>
    </div>
  </div>

  <div class="card">
    <div class="h2">📤 Export</div>
    <p class="muted" style="margin-bottom:12px;">${tr("CSV für Excel & Auswertungen am Computer. „Excel (DE)\" nutzt Semikolon und Dezimalkomma.")}</p>
    <div style="display:grid; gap:8px;">
      <button class="btn secondary" onclick="exportCSV('trip', true)">${tr("Aktuelle Reise → Excel (DE)")}</button>
      <button class="btn secondary" onclick="exportCSV('all', true)">${tr("Alle Reisen → Excel (DE)")}</button>
      <button class="btn secondary" onclick="exportSummary()">${tr("Zusammenfassung „{n}\" → Excel (DE)", { n: esc((activeTrip() || {}).name || "") })}</button>
      <button class="btn ghost" onclick="exportCSV('all', false)">${tr("Alle Reisen → Standard-CSV")}</button>
    </div>
  </div>

  <div class="card">
    <div class="h2">💾 Backup</div>
    <p class="muted" style="margin-bottom:12px;">${tr("Deine Daten liegen nur auf diesem Gerät. Sichere sie regelmäßig als JSON-Datei.")}</p>
    <div style="display:grid; gap:8px;">
      <button class="btn secondary" onclick="exportBackup()">${tr("Backup erstellen (JSON)")}</button>
      <button class="btn ghost" onclick="document.getElementById('importFile').click()">${tr("Backup wiederherstellen")}</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="if(this.files[0]) importBackup(this.files[0]); this.value='';">
    </div>
    ${state.lastBackupAt ? `<div class="muted" style="text-align:center; margin-top:8px;">${tr("Letztes Backup: {d}", { d: new Date(state.lastBackupAt).toLocaleDateString(LOCALE(), { day: "numeric", month: "short", year: "numeric" }) })}</div>` : ""}
    <label class="field" style="margin-top:14px;"><span>${tr("Cloud-Backup nach Google Drive (geheime Skript-Adresse)")}</span>
      <input id="cloudUrl" type="url" value="${esc(cloudCfg().url || "")}" placeholder="https://script.google.com/…/exec"
        autocomplete="off" onchange="setCloudUrl(this.value)"></label>
    ${cloudCfg().url ? `<button class="btn secondary" onclick="cloudBackupNow()">${tr("Jetzt in die Cloud sichern")}</button>
    <div class="muted" style="text-align:center; margin-top:6px;">${cloudCfg().lastAt ? tr("Letzte Cloud-Sicherung: {d}", { d: new Date(cloudCfg().lastAt).toLocaleString(LOCALE(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) }) : tr("Sichert automatisch beim App-Start, sobald du online bist.")}</div>`
    : `<p class="muted" style="margin-top:2px;">${tr("Optional: sichert automatisch in dein Google Drive. Die Adresse bleibt nur auf diesem Gerät.")}</p>`}
  </div>

  <div class="card">
    <div class="h2">⚙️ ${tr("Einstellungen")}</div>
    <label class="field"><span>${tr("Sprache")}</span></label>
    <div class="payer-row" style="margin-top:-6px;">
      ${[["auto", tr("Automatisch")], ["de", "Deutsch"], ["en", "English"]].map(([v, l]) =>
        `<button class="chip ${((state.settings.lang || "auto") === v) ? "on" : ""}" onclick="setLang('${v}')">${l}</button>`).join("")}
    </div>
    <label class="field"><span>${tr("Design")}</span></label>
    <div class="payer-row" style="margin-top:-6px;">
      ${[["auto", tr("Automatisch")], ["light", tr("Hell")], ["dark", tr("Dunkel")]].map(([t, l]) =>
        `<button class="chip ${(state.settings.theme || "auto") === t ? "on" : ""}" onclick="setTheme('${t}')">${l}</button>`).join("")}
    </div>
    <label class="field"><span>${tr("Heimatwährung")}</span>
      <button type="button" class="select-btn" onclick="openCurSheet('home')">${curFlag(state.homeCurrency)}${esc(state.homeCurrency)} – ${esc(curName(state.homeCurrency))} &nbsp;▾</button></label>
    <label class="field"><span>${tr("Eigene Kategorien")}</span></label>
    ${(state.customCategories || []).length
      ? state.customCategories.map(c => `<div class="list-item"><b>${c.icon} ${esc(c.name)}</b><button class="btn ghost" style="width:auto;padding:4px 8px;" onclick="deleteCustomCategory('${c.id}')">${tr("Entfernen")}</button></div>`).join("")
      : `<p class="muted" style="margin-top:-2px;">${tr("Noch keine – beim Eintragen unter „Alle Kategorien\" über die Kachel „+ Eigene\" anlegen.")}</p>`}
    <button class="btn ghost" onclick="refreshRates().then(()=>toast(tr(state.rates.source === 'live' ? 'Kurse: aktuell' : 'Kurse: Offline-Fallback')))">${tr("Wechselkurse aktualisieren")}</button>
    <div class="muted" style="text-align:center; margin-top:4px;">${tr(state.rates.source === "live" ? "Kurse: aktuell" : "Kurse: Offline-Fallback")}</div>
    <p class="muted" style="margin-top:10px;">${tr("Einstellungen zur einzelnen Reise (Budget, Datum, Reisende …) findest du unter Reisen → ✎.")}</p>
  </div>

  <div class="offline-note">${tr("TallyAway · Prototyp · läuft komplett auf deinem Gerät")}</div>
  <div style="height:10px"></div>`;
}
function addTraveler() {
  const t = editingTrip(); if (!t) return;
  const n = prompt(tr("Name der Person:"), "");
  if (!n || !n.trim()) return;
  t.travelers.push(n.trim()); saveState(); render();
}
function removeTripCountry(i) {
  const t = editingTrip(); if (!t) return;
  t.countries = tripCountries(t).filter((_, x) => x !== i);
  t.country = t.countries.length ? t.countries[0].name : null;
  saveState(); render();
}
function removeTraveler(i) {
  const t = editingTrip(); if (!t) return;
  t.travelers.splice(i, 1);
  if (!t.travelers.length) t.travelers = ["Ich"];
  saveState(); render();
}
function setHomeCurrency(c) {
  state.homeCurrency = c;
  /* recompute all stored home amounts with current rates */
  for (const t of state.trips) for (const e of (t.expenses || [])) {
    e.amountHome = Math.round(toHome(e.amount, e.currency) * 100) / 100;
    e.rate = e.currency === c ? 1 : Math.round((rateFor(c) / (rateFor(e.currency) || 1)) * 10000) / 10000;
  }
  saveState(); render(); toast(tr("Heimatwährung: {c}", { c }));
}
/* ---------------- Boot ---------------- */
applyTheme();
render();
refreshRates();
autoCloudBackup();
/* refresh the restore timestamp when the app is backgrounded, so returning
   shortly after keeps the view */
addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveUi(); });
/* ask the browser to protect this origin's storage from eviction — matters on
   iOS, which may purge localStorage of rarely used web apps */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").then((reg) => {
    /* look for a fresh build whenever the app returns to the foreground */
    addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {});
  /* the new SW takes over immediately (skipWaiting + clients.claim in sw.js) —
     offer a one-tap reload instead of the old "close and reopen twice" dance.
     hadController guards the very first install, where no update happened. */
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController) toastAction(tr("Neue Version verfügbar"), tr("Neu laden"), () => location.reload(), 12000);
    hadController = true;
  });
}
</script>
</body>
