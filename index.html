<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>TallyAway</title>
<meta name="description" content="Reiseausgaben unterwegs erfassen – offline, mit Währungsumrechnung und CSV-Export.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d9488">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TallyAway">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<style>
  :root {
    --bg: #f2f5f7;
    --card: #ffffff;
    --accent: #0d9488;
    --accent-deep: #0f766e;
    --accent-soft: #e6f4f2;
    --on-accent: #ffffff;
    --ink: #10201e;
    --muted: #5b6b6f;
    --line: #e4eaec;
    --danger: #c2410c;
    --danger-bg: #fdf0e9;
    --warn: #b45309;
    --nav-bg: rgba(255,255,255,.94);
    --toast-bg: #10201e;
    --toast-ink: #ffffff;
    --radius: 18px;
    --shadow: 0 1px 3px rgba(16,32,30,.06), 0 6px 20px rgba(16,32,30,.05);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  html[data-theme="dark"] {
    --bg: #0e1517;
    --card: #192426;
    --accent: #0fa896;            /* validated on dark surface */
    --accent-deep: #2dd4bf;
    --accent-soft: #12332f;
    --on-accent: #04211d;
    --ink: #e6eeee;
    --muted: #8fa3a6;
    --line: #243133;
    --danger: #fb923c;
    --danger-bg: #3a2415;
    --warn: #fbbf24;
    --nav-bg: rgba(17,26,28,.94);
    --toast-bg: #e6eeee;
    --toast-ink: #10201e;
    --shadow: 0 1px 3px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink);
    padding-top: var(--safe-top);
    overscroll-behavior-y: none;
  }
  #app { max-width: 520px; margin: 0 auto; padding: 16px 16px calc(96px + var(--safe-bottom)); min-height: 100vh; }

  /* ---------- Generic ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
  .h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .h2 { font-size: 15px; font-weight: 650; margin-bottom: 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; font-size: 15px; }
  .btn { background: var(--accent); color: var(--on-accent); font-weight: 650; padding: 14px 20px; border-radius: 14px; width: 100%; font-size: 16px; }
  .btn:active { background: var(--accent-deep); }
  .btn.secondary { background: var(--accent-soft); color: var(--accent-deep); }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.danger { background: var(--danger-bg); color: var(--danger); }
  input, select {
    font-family: inherit; font-size: 16px; width: 100%;
    padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 13px;
    background: var(--card); color: var(--ink); outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  /* iOS centers the value of date inputs and collapses empty ones — force
     left alignment and a stable height so they line up with text inputs */
  input[type="date"] { -webkit-appearance: none; appearance: none; min-height: 48px; text-align: left; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
  /* button styled as a select field (opens the country sheet) */
  .select-btn {
    font-family: inherit; font-size: 16px; width: 100%; text-align: left;
    padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 13px;
    background: var(--card); color: var(--ink);
  }
  .select-btn.placeholder { color: var(--muted); }
  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 550; }

  /* ---------- Top bar ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 2px 16px; }
  .topbar .title { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
  .trip-chip { background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 8px 12px; font-size: 12.5px; font-weight: 650; color: var(--accent-deep); max-width: 52vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn { background: var(--card); box-shadow: var(--shadow); border-radius: 999px; width: 38px; height: 38px; font-size: 17px; flex: none; display: flex; align-items: center; justify-content: center; }

  /* ---------- Budget ring ---------- */
  .ring-wrap { display: flex; align-items: center; gap: 18px; }
  .ring { position: relative; width: 132px; height: 132px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .center .big { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
  .ring .center .sub { font-size: 11px; color: var(--muted); }
  .kpis { flex: 1; display: grid; gap: 10px; }
  .kpi .v { font-size: 17px; font-weight: 750; letter-spacing: -.01em; }
  .kpi .l { font-size: 12px; color: var(--muted); }
  .kpi .v.warn { color: var(--danger); }

  /* ---------- Mini bar chart ---------- */
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 72px; margin-top: 6px; }
  .spark .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .spark .bar { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .45; }
  .spark .col.today .bar { opacity: 1; }
  /* advance bookings, summed into one bar in front of the trip window */
  .spark .col.pre { border-right: 1px dashed var(--line); padding-right: 4px; margin-right: 4px; }
  .spark .col.pre .bar { background: var(--muted); opacity: .5; }
  .spark .d { font-size: 9px; color: var(--muted); }
  /* long trips: the chart scrolls horizontally (swipe like the chip row) —
     every day keeps a full-size horizontal number and a decently wide bar */
  .spark.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .spark.scroll::-webkit-scrollbar { display: none; }
  .spark.scroll .col { flex: 0 0 24px; }

  /* ---------- Category bars ---------- */
  .cat-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .cat-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 17px; flex: none; }
  .cat-mid { flex: 1; min-width: 0; }
  .cat-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-track { height: 6px; background: var(--bg); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .cat-fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .cat-amt { font-size: 13px; font-weight: 700; flex: none; }

  /* ---------- Expense list ---------- */
  .day-head { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 16px 4px 6px; display: flex; justify-content: space-between; }
  .exp { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 8px; }
  .exp .info { flex: 1; min-width: 0; }
  .exp .t { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exp .s { font-size: 12px; color: var(--muted); }
  .exp .amts { text-align: right; flex: none; }
  .exp .home { font-size: 14.5px; font-weight: 750; }
  .exp .orig { font-size: 11.5px; color: var(--muted); }

  /* ---------- Add screen ---------- */
  /* amount as a tappable FIELD (reference design): white card, left-aligned
     number, tapping it pops the keypad like the OS keyboard */
  .amount-display {
    background: var(--card); border-radius: 14px; box-shadow: var(--shadow);
    padding: 12px 16px 8px; margin-bottom: 4px; cursor: pointer;
  }
  .amount-display .val { font-size: 32px; font-weight: 750; letter-spacing: -.02em; line-height: 1.25; }
  .amount-display .conv { font-size: 13px; color: var(--muted); min-height: 18px; }
  .cur-row { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 14px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .cur-row::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 9px 16px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 14px; font-weight: 650; color: var(--muted); }
  .chip.on { background: var(--accent); color: var(--on-accent); }
  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 78px; gap: 8px; margin-bottom: 14px; }
  /* strictly identical tiles: HARD 78px row height, icon and name rows are
     fixed and clipped — oversized emoji glyphs (iOS) can no longer stretch
     a tile (owner: symmetric) */
  .cat-cell { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 6px 4px; text-align: center; border: 2px solid transparent; height: 100%; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .cat-cell .e { font-size: 21px; line-height: 26px; height: 26px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .cat-cell .n { font-size: 9.5px; color: var(--muted); line-height: 1.2; font-weight: 600; height: 23px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .cat-cell.on { border-color: var(--accent); background: var(--accent-soft); }
  .cat-cell.on .n { color: var(--accent-deep); }
  /* Cancel/Add as soft pill buttons (reference design the owner liked):
     card-colored capsules with accent text, both in the topbar */
  .pill-btn {
    background: var(--card); box-shadow: var(--shadow); border-radius: 999px;
    padding: 10px 18px; font-size: 15px; font-weight: 600; color: var(--accent-deep);
  }
  .pill-btn:active { background: var(--accent-soft); }
  .pill-btn.primary { font-weight: 800; }
  .payer-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

  /* ---------- Bottom nav ---------- */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: var(--nav-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding: 8px 8px calc(8px + var(--safe-bottom));
  }
  .nav .inner { max-width: 520px; margin: 0 auto; display: flex; align-items: center; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: var(--muted); font-size: 10.5px; font-weight: 600; }
  /* active tab: soft pill around the icon so the current view is obvious */
  .nav-btn .i { font-size: 21px; line-height: 1; padding: 3px 14px; border-radius: 999px; }
  .nav-btn.on { color: var(--accent-deep); font-weight: 800; }
  .nav-btn.on .i { background: var(--accent); background: color-mix(in srgb, var(--accent) 55%, var(--card)); box-shadow: 0 2px 6px rgba(13,148,136,.25); }
  .fab {
    flex: none; width: 58px; height: 58px; margin: -26px 6px 0; border-radius: 50%;
    background: var(--accent); color: var(--on-accent); font-size: 30px; font-weight: 500;
    box-shadow: 0 6px 18px rgba(13,148,136,.4); display: flex; align-items: center; justify-content: center;
    /* the "+" glyph sits low in its em box — flex centers the box, not the
       ink; measured 3px offset, compensated here so the plus is dead center */
    padding-bottom: 6px;
  }
  .fab:active { background: var(--accent-deep); }

  /* ---------- Misc ---------- */
  .empty { text-align: center; padding: 44px 20px; color: var(--muted); }
  .empty .e { font-size: 44px; margin-bottom: 10px; }
  .list-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 2px; border-bottom: 1px solid var(--line); }
  .list-item:last-child { border-bottom: none; }
  .pill { font-size: 11px; font-weight: 700; background: var(--accent-soft); color: var(--accent-deep); border-radius: 999px; padding: 4px 10px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(110px + var(--safe-bottom)); transform: translateX(-50%);
    background: var(--toast-bg); color: var(--toast-ink); font-size: 13.5px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .25s; z-index: 100; pointer-events: none;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  /* toast with a tappable action (undo, reload) — must accept the tap */
  .toast.actionable { pointer-events: auto; }
  .toast-btn { color: inherit; font-weight: 800; font-size: 13.5px; margin-left: 12px; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
  .refund-row { display: flex; justify-content: center; padding-bottom: 2px; }
  .refund-row .chip { padding: 6px 14px; font-size: 12.5px; }
  .overlay { position: fixed; inset: 0; background: rgba(16,32,30,.45); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 520px; border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + var(--safe-bottom)); max-height: 88vh; overflow-y: auto; }
  .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 16px; }
  .offline-note { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 6px; }
  .cur-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 13px 6px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .cur-item b { flex: none; width: 82px; }
  .cur-item span { flex: 1; text-align: right; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav"><div class="inner" id="navInner"></div></nav>
<div id="sheetHost"></div>
<div class="toast" id="toast"></div>

   Architecture: single-file vanilla JS, state in localStorage,
   full re-render per navigation.

/* ---------------- Constants ---------------- */
/* NOTE: the app was renamed to TallyAway (2026-08). The localStorage keys
   below keep their original "urlaubskasse" names FOREVER — changing them
   would orphan the data already stored on the owner's phones. */
const LS_KEY = "urlaubskasse_v1";
const SCHEMA_VERSION = 3;
/* Reloading mid-session should keep you where you are; opening the app after
   a break should start on the dashboard. So the view is restored only within
   this window, and only for views that carry no in-memory draft state
   (add / add-trip / trip-edit would come back as empty forms).
   UI_KEY is its own tiny entry: written on every view change without
   re-serialising the whole state, and never part of the JSON backup.
   These MUST stay above `let state = loadState()` — restoreUi() runs there. */
const UI_KEY = "urlaubskasse_ui";
/* Cloud backup target (Google Apps Script /exec URL) — DEVICE-LOCAL secret.
   Deliberately its own key: it must never travel inside the state object,
   backup JSONs, or exports. */
const CLOUD_KEY = "urlaubskasse_cloud";
const RESTORE_VIEWS = ["home", "expenses", "stats", "trips", "more"];
const RESTORE_WINDOW_MS = 30 * 60 * 1000;
/* views holding uncontrolled form inputs — must never be re-rendered from
   background work (see refreshRates) */
const FORM_VIEWS = ["add", "add-trip", "trip-edit"];

function defaultState() {
  return {
    version: SCHEMA_VERSION,
    trips: [],
    activeTripId: null,
    travelers: ["Ich"],
    homeCurrency: "EUR",
    recentCurrencies: ["EUR", "USD"],
    rates: { base: "EUR", date: null, map: { ...FALLBACK_RATES }, source: "fallback" },
    settings: { theme: "auto" },
    customCategories: [],      /* user-defined {id, name, icon}; ids never change */
    ui: { view: "home" },
    lastBackupAt: null,        /* ISO of the last JSON backup (drives the reminder) */
    backupSnoozedUntil: null,  /* ISO; "Später" on the reminder snoozes 7 days */
  };
}

let state = loadState();
let draft = null;          // in-progress expense entry
let editingExpenseId = null;

/* Schema migrations. v1 → v2: travelers moved from global state to per-trip
   (trip.travelers); the old global list seeds every existing trip. The legacy
   state.travelers field is kept untouched (never silently drop stored data).
   v2 → v3: multi-destination trips — trip.countries [{name, cur}] replaces the
   single trip.country as source of truth; trip.country stays as mirror of the
   first entry, trip.currency stays the independent default entry currency. */
function migrateState(s) {
  if ((s.version || 1) < 2) {
    const global = Array.isArray(s.travelers) && s.travelers.length ? s.travelers : ["Ich"];
    for (const t of s.trips || []) if (!Array.isArray(t.travelers) || !t.travelers.length) t.travelers = [...global];
    s.version = 2;
  }
  if (s.version < 3) {
    for (const t of s.trips || []) if (!Array.isArray(t.countries))
      t.countries = t.country ? [{ name: t.country, cur: t.currency || s.homeCurrency || "EUR" }] : [];
    s.version = 3;
  }
  for (const t of s.trips || []) {
    if (!Array.isArray(t.travelers) || !t.travelers.length) t.travelers = ["Ich"];
    if (!Array.isArray(t.countries)) t.countries = [];
  }
  if (!Array.isArray(s.customCategories)) s.customCategories = []; /* additive, pre-custom backups */
  return s;
}

function saveUi() {
  try { localStorage.setItem(UI_KEY, JSON.stringify({ view: state.ui.view, at: Date.now() })); } catch (e) { /* quota — ignore */ }
}
function restoreUi() {
  try {
    const ui = JSON.parse(localStorage.getItem(UI_KEY) || "null");
    const recent = ui && ui.at && Date.now() - ui.at < RESTORE_WINDOW_MS;
    return { view: recent && RESTORE_VIEWS.includes(ui.view) ? ui.view : "home" };
  } catch (e) { return { view: "home" }; }
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    const d = defaultState();
    return migrateState({ ...d, ...s, rates: { ...d.rates, ...(s.rates || {}) }, settings: { ...d.settings, ...(s.settings || {}) }, ui: restoreUi() });
  } catch (e) {
    console.error("State load failed", e);
    return defaultState();
  }
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { toast(tr("Speichern fehlgeschlagen – Speicher voll?")); }
}

/* ---------------- Helpers ---------------- */
const $ = (sel) => document.querySelector(sel);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------------- Language (i18n) ----------------
   German strings ARE the keys; the EN dictionary maps them. Unknown keys fall
   back to German, so a missing translation can never blank the UI. Stored
   data (trip/country names, category ids) always stays German — only the
   DISPLAY translates. settings.lang: "auto" (device) | "de" | "en". */
function appLang() {
  const pref = (state.settings && state.settings.lang) || "auto";
  if (pref === "de" || pref === "en") return pref;
  return (navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en";
}
function LOCALE() { return appLang() === "de" ? "de-DE" : "en-US"; }
function tr(s, vars) { /* named tr, not t — `t` is the trip loop variable everywhere */
  let out = appLang() === "de" ? s : (EN[s] !== undefined ? EN[s] : s);
  if (vars) for (const k of Object.keys(vars)) out = out.replaceAll("{" + k + "}", vars[k]);
  return out;
}
function setLang(l) {
  state.settings.lang = l;
  _dn = null; /* currency-name cache is per language */
  saveState(); render();
}
/* English display name for a stored German country name (via its ISO code) */
let _dnRegionEn = null;
function countryDisplay(germanName) {
  if (appLang() === "de") return germanName;
  const code = _regionData().byName[germanName];
  if (!code) return germanName;
  try {
    _dnRegionEn = _dnRegionEn || new Intl.DisplayNames(["en"], { type: "region" });
    return _dnRegionEn.of(code) || germanName;
  } catch { return germanName; }
}

function fmt(n, cur) {
  cur = cur || state.homeCurrency;
  try {
    return new Intl.NumberFormat(LOCALE(), { style: "currency", currency: cur, minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
  } catch { return n.toFixed(2) + " " + cur; }
}
function fmtShort(n, cur) {
  cur = cur || state.homeCurrency;
  /* like fmt, but drops the cents for large amounts; Intl also puts the
     symbol on the locale-correct side (€90.64 in en, 90,64 € in de) */
  const digits = Math.abs(n) >= 100 ? 0 : 2;
  try {
    return new Intl.NumberFormat(LOCALE(), { style: "currency", currency: cur, minimumFractionDigits: digits, maximumFractionDigits: digits }).format(Math.round(n * 100) / 100);
  } catch { return n.toFixed(digits) + " " + cur; }
}
function todayISO() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function yesterdayISO() { const d = new Date(); d.setDate(d.getDate() - 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dateLabel(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const today = todayISO();
  if (iso === today) return tr("Heute");
  const yd = new Date(); yd.setDate(yd.getDate() - 1);
  if (dt.toDateString() === yd.toDateString()) return tr("Gestern");
  return dt.toLocaleDateString(LOCALE(), { weekday: "short", day: "numeric", month: "short" });
}
function allCats() { return CATEGORIES.concat(state.customCategories || []); }
function catById(id) { return allCats().find(c => c.id === id) || CATEGORIES[CATEGORIES.length - 1]; }
/* Fixed per-category colors for the dashboard donut + breakdown bars (the six

function catColor(cid) { return CAT_COLORS[cid] || "var(--muted)"; }

function applyTheme() {

  const dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";

let _dn = null;
function curName(code) {
  try {
    _dn = _dn || new Intl.DisplayNames([LOCALE()], { type: "currency" });
    return _dn.of(code) || code;
  } catch { return code; }
}
function allCurrencyCodes() {
  return [...new Set([...Object.keys(state.rates.map), ...Object.keys(FALLBACK_RATES)])].sort();
}

/* Emoji flags for the currency/country picker rows. German region names come
   from Intl.DisplayNames (offline, ships no data); the few names our
   COUNTRIES list spells differently are mapped by hand. */
const FLAG_OVERRIDES = {
  "Botswana": "BW", "Brunei": "BN", "Elfenbeinküste": "CI", "Großbritannien": "GB",
  "Hongkong": "HK", "Kap Verde": "CV", "Kongo (Dem. Republik)": "CD",
  "Kongo (Republik)": "CG", "Moldau": "MD", "Osttimor": "TL", "Palästina": "PS", "USA": "US",
  "Russland": "RU", /* some engines alias the deprecated SU code to the same label */
  "Ver. Arab. Emirate": "AE", /* trip configs use the short form */
};
let _regions = null; /* { byName: {germanName: ISO2}, valid: Set(ISO2) } */
function _regionData() {
  if (_regions) return _regions;
  _regions = { byName: {}, valid: new Set() };
  /* deprecated ISO codes CLDR still labels (DDR, Nordvietnam, Burma, UdSSR…)
     — they have no flag emoji and must never win a label */
  const DEPRECATED = new Set(["AN", "BU", "CS", "DD", "DY", "FX", "HV", "NT", "RH", "SU", "TP", "VD", "YD", "YU", "ZR"]);
  try {
    const dn = new Intl.DisplayNames(["de"], { type: "region" });
    for (let i = 0; i < 26; i++) for (let j = 0; j < 26; j++) {
      const code = String.fromCharCode(65 + i) + String.fromCharCode(65 + j);
      if (DEPRECATED.has(code)) continue;
      let label; try { label = dn.of(code); } catch { continue; }
      if (label && label !== code) {
        if (!(label in _regions.byName)) _regions.byName[label] = code;
        _regions.valid.add(code);
      }
    }
  } catch (e) { /* very old engine — rows just render without flags */ }
  Object.assign(_regions.byName, FLAG_OVERRIDES);
  return _regions;
}
function flagEmoji(iso2) { return String.fromCodePoint(...[...iso2].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65)); }
function countryFlag(name) { const code = _regionData().byName[name]; return code ? flagEmoji(code) + " " : ""; }
/* ISO-4217: the first two letters are the issuer country (EUR resolves via EU).
   Supranational currencies (CFA-Franc & Co., X-prefix) have no country — they
   get a globe so no row looks forgotten. ANG's issuer country was dissolved
   in 2010; Curaçao is the factual successor. */
const CUR_FLAG_SPECIAL = { "ANG": "CW" };
function curFlag(code) {
  code = String(code);
  if (CUR_FLAG_SPECIAL[code]) return flagEmoji(CUR_FLAG_SPECIAL[code]) + " ";
  /* X-prefix = supranational (CFA-Franc & Co.) — "XA"/"XB" are pseudo test
     regions in CLDR, so they must never reach the region lookup */
  if (code[0] === "X") return "🌍 ";
  const cc = code.slice(0, 2);
  return _regionData().valid.has(cc) ? flagEmoji(cc) + " " : "🌍 ";
}

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.remove("actionable");
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2200);
}
/* Toast with a tappable action button (delete-undo, update-reload). */
function toastAction(msg, label, fn, ms) {
  const el = $("#toast");
  el.innerHTML = esc(msg) + `<button class="toast-btn" id="toastBtn">${esc(label)}</button>`;
  el.classList.add("actionable", "show");
  $("#toastBtn").onclick = () => { el.classList.remove("show", "actionable"); fn(); };
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show", "actionable"), ms || 6000);
}

/* ---------------- Currency ---------------- */
function rateFor(cur) {
  const m = state.rates.map;
  return m[cur] || FALLBACK_RATES[cur] || null;
}
/* Convert an amount in `cur` to the home currency. */
function toHome(amount, cur) {
  if (cur === state.homeCurrency) return amount;
  const rCur = rateFor(cur), rHome = rateFor(state.homeCurrency);
  if (!rCur || !rHome) return amount;
  return amount / rCur * rHome;
}
async function refreshRates() {
  try {
    const res = await fetch("https://open.er-api.com/v6/latest/EUR", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (data && data.result === "success" && data.rates) {
      state.rates = { base: "EUR", date: data.time_last_update_utc || new Date().toISOString(), map: { EUR: 1, ...data.rates }, source: "live" };
      upgradeFallbackExpenses();
      saveState();
      /* Never re-render a form the user is filling in — rates arriving in the
         background would wipe the uncontrolled inputs (trip name, budget,
         dates, destination list). On the add screen just refresh the
         converted-amount line in place. */
      if (FORM_VIEWS.includes(state.ui.view)) {
        const disp = $(".amount-display");
        if (disp && state.ui.view === "add") disp.innerHTML = amountDisplayHTML();
      } else {
        render();
      }
    }
  } catch (e) { /* offline – keep cached/fallback rates */ }
}
/* One-time correction: expenses converted with the bundled FALLBACK rates get
   re-converted once real (live) rates arrive. Expenses entered with live or
   cached-live rates stay frozen at their entry-time rate. */
function upgradeFallbackExpenses() {
  let n = 0;
  for (const t of state.trips) for (const e of (t.expenses || [])) {
    if (e.rateSource === "fallback" && e.currency !== state.homeCurrency) {
      e.amountHome = Math.round(toHome(e.amount, e.currency) * 100) / 100;
      e.rate = Math.round((rateFor(state.homeCurrency) / (rateFor(e.currency) || 1)) * 10000) / 10000;
      e.rateSource = "live";
      n++;
    }
  }
  if (n) toast(n === 1 ? tr("1 Eintrag mit aktuellem Kurs neu berechnet") : tr("{n} Einträge mit aktuellem Kurs neu berechnet", { n }));
}

/* ---------------- Trip stats ---------------- */
function tripExpenses(trip) { return (trip.expenses || []).slice().sort((a, b) => (b.date + (b.ts || "")).localeCompare(a.date + (a.ts || ""))); }
function tripTotal(trip) { return (trip.expenses || []).reduce((s, e) => s + e.amountHome, 0); }
function tripTravelers(trip) { return trip && Array.isArray(trip.travelers) && trip.travelers.length ? trip.travelers : ["Ich"]; }
function tripCountries(trip) { return trip && Array.isArray(trip.countries) ? trip.countries : []; }
function tripStart(trip) {
  return trip.startDate || ((trip.expenses || []).length ? trip.expenses.map(e => e.date).sort()[0] : todayISO());
}
/* End of the window a trip is measured over: the trip end for finished trips,
   today for running ones, and the full planned end for trips still ahead
   (so an advance booking cannot squeeze the window down to a single day). */
function tripWindowEnd(trip) {
  const start = tripStart(trip), today = todayISO();
  if (trip.endDate) return (trip.endDate < today || today < start) ? trip.endDate : today;
  return today < start ? start : today;
}
function tripDays(trip) {
  const start = tripStart(trip);
  const end = tripWindowEnd(trip);
  const from = new Date(start), to = new Date(end < start ? start : end);
  return Math.max(1, Math.round((to - from) / 86400000) + 1);
}
function tripStarted(trip) { return !trip.startDate || todayISO() >= trip.startDate; }
/* Days of the trip already lived through — 0 before departure. */
function tripElapsedDays(trip) { return tripStarted(trip) ? tripDays(trip) : 0; }
/* Anything paid before departure (flights, rental car …): counts towards the
   budget, but is kept apart from what is actually spent on location. */
function tripPreTotal(trip) {
  if (!trip.startDate) return 0;
  return (trip.expenses || []).filter(e => e.date < trip.startDate).reduce((s, e) => s + e.amountHome, 0);
}
function byCategory(trip) {
  const m = {};
  for (const e of trip.expenses || []) m[e.category] = (m[e.category] || 0) + e.amountHome;
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}
/* Per-country sums for multi-destination trips; "—" = no country recorded. */
function byCountry(trip) {
  const m = {};
  for (const e of trip.expenses || []) { const k = e.country || "—"; m[k] = (m[k] || 0) + e.amountHome; }
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}
function byPayer(trip) {
  const m = {};
  for (const e of trip.expenses || []) { const p = e.payer || tripTravelers(trip)[0]; m[p] = (m[p] || 0) + e.amountHome; }
  return m;
}
/* Daily-sum series for the dashboard chart.
   mode "trip" (default): whole trip — from start (or first expense, whichever
   is earlier) to trip end / today; capped at 92 bars for very long trips.
   mode "14": the old rolling last-14-days window (only useful mid-trip). */
function sparkDays(trip, mode) {
  const days = [];
  let from, to;
  if (mode === "14") {
    to = new Date(); from = new Date(); from.setDate(from.getDate() - 13);
  } else {
    /* Only the trip window itself — advance bookings would otherwise stretch
       the chart over months of empty days. They get one leading bar instead. */
    const pre = tripPreTotal(trip);
    if (pre > 0) days.push({ iso: "pre", sum: pre, label: tr("vor"), pretty: tr("vorab gebucht") });
    const startIso = tripStart(trip);
    const endIso = tripWindowEnd(trip);
    from = new Date(startIso); to = new Date(endIso < startIso ? startIso : endIso);
    if ((to - from) / 86400000 > 91) { from = new Date(to); from.setDate(from.getDate() - 91); }
  }
  for (let d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) {
    const iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const sum = (trip.expenses || []).filter(e => e.date === iso).reduce((s, e) => s + e.amountHome, 0);
    days.push({ iso, sum, label: d.getDate(), pretty: d.toLocaleDateString(LOCALE(), { day: "numeric", month: "short" }) });
  }
  return days;
}

/* Budget warnings: toast once when spending crosses 75% / 90% / 100% of the
   trip budget. trip.budgetWarned stores the current bracket, so dropping
   below (delete, budget raised) re-arms the warning for the next crossing. */
function checkBudgetWarning(trip) {
  if (!trip) return;
  const b = trip.budget || 0;
  const p = b > 0 ? tripTotal(trip) / b * 100 : 0;
  const lvl = p >= 100 ? 100 : p >= 90 ? 90 : p >= 75 ? 75 : 0;
  if (lvl > (trip.budgetWarned || 0))
    toast(lvl >= 100 ? tr("⚠️ Budget überschritten!") : tr("⚠️ {p} % des Budgets verbraucht", { p: lvl }));
  trip.budgetWarned = lvl;
}

/* ---------------- CSV / Backup export ---------------- */
function csvEscape(v) { v = String(v ?? ""); return /[";\n,]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

function buildCSV(trips, germanExcel) {
  const sep = germanExcel ? ";" : ",";
  const num = (n) => germanExcel ? String(n.toFixed(2)).replace(".", ",") : n.toFixed(2);
  const head = [tr("Datum"), tr("Zeitstempel"), tr("Reise"), tr("Land"), tr("Ort"), tr("Beschreibung"), tr("Kategorie"), tr("Betrag"), tr("Währung"), tr("Betrag ({c})", { c: state.homeCurrency }), tr("Kurs"), tr("Bezahlt von"), tr("Notiz")];
  const rows = [head.join(sep)];
  for (const t of trips) {
    for (const e of (t.expenses || []).slice().sort((a, b) => a.date.localeCompare(b.date))) {
      rows.push([
        e.date, e.ts || "", csvEscape(t.name), csvEscape(e.country ? countryDisplay(e.country) : ""),
        csvEscape(e.location ? (e.location.label || e.location.lat + "," + e.location.lon) : ""),
        csvEscape(e.note || tr(catById(e.category).name)), csvEscape(tr(catById(e.category).name)),
        num(e.amount), e.currency, num(e.amountHome),
        germanExcel ? String((e.rate || 1).toFixed(4)).replace(".", ",") : (e.rate || 1).toFixed(4),
        csvEscape(e.payer || ""), csvEscape(e.note || ""),
      ].join(sep));
    }
  }
  return rows.join("\r\n");
}

async function downloadText(filename, text, mime) {
  const blob = new Blob(["﻿" + text], { type: (mime || "text/csv") + ";charset=utf-8" });
  const file = new File([blob], filename, { type: mime || "text/csv" });
  /* Prefer native share sheet on mobile (iOS Safari can't always download) */
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    /* false = user cancelled the share sheet (backup reminder must not count that) */
    try { await navigator.share({ files: [file], title: filename }); return true; } catch (e) { if (e.name === "AbortError") return false; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
  return true;
}

function exportCSV(scope, germanExcel) {
  const trips = scope === "all" ? state.trips : [activeTrip()].filter(Boolean);
  if (!trips.length || trips.every(t => !(t.expenses || []).length)) { toast(tr("Keine Ausgaben zum Exportieren")); return; }
  const name = (scope === "all" ? "tallyaway-alle-reisen" : "tallyaway-" + slug(trips[0].name)) + "-" + todayISO() + ".csv";
  downloadText(name, buildCSV(trips, germanExcel));
}
/* Summary CSV: trip facts + per-category / per-day / per-person breakdowns.
   Same German-Excel conventions as buildCSV (semicolon, decimal comma, BOM). */
function buildSummaryCSV(trip, germanExcel) {
  const sep = germanExcel ? ";" : ",";
  const num = (n) => germanExcel ? n.toFixed(2).replace(".", ",") : n.toFixed(2);
  const total = tripTotal(trip);
  const days = tripDays(trip);
  const rows = [];
  rows.push([tr("Reise"), csvEscape(trip.name)].join(sep));
  if (tripCountries(trip).length) rows.push([tr("Reiseziel"), csvEscape(tripCountries(trip).map(c => countryDisplay(c.name)).join(", "))].join(sep));
  rows.push([tr("Zeitraum"), (trip.startDate || "") + tr(" bis ") + (trip.endDate || tr("heute"))].join(sep));
  rows.push([tr("Reisetage"), days].join(sep));
  rows.push([tr("Anzahl Ausgaben"), (trip.expenses || []).length].join(sep));
  if (trip.budget > 0) {
    rows.push([tr("Budget ({c})", { c: state.homeCurrency }), num(trip.budget)].join(sep));
    rows.push([tr("Restbudget ({c})", { c: state.homeCurrency }), num(trip.budget - total)].join(sep));
  }
  rows.push([tr("Gesamtausgaben ({c})", { c: state.homeCurrency }), num(total)].join(sep));
  const pre = tripPreTotal(trip);
  if (pre > 0) {
    rows.push([tr("davon vorab gebucht ({c})", { c: state.homeCurrency }), num(pre)].join(sep));
    rows.push([tr("davon vor Ort ausgegeben ({c})", { c: state.homeCurrency }), num(total - pre)].join(sep));
  }
  rows.push([tr("Durchschnitt pro Tag vor Ort ({c})", { c: state.homeCurrency }), num((total - pre) / days)].join(sep));
  rows.push("", [tr("Kategorie"), tr("Betrag ({c})", { c: state.homeCurrency }), tr("Anteil %")].join(sep));
  for (const [cid, sum] of byCategory(trip))
    rows.push([csvEscape(tr(catById(cid).name)), num(sum), num(total ? sum / total * 100 : 0)].join(sep));
  if (tripCountries(trip).length > 1 && byCountry(trip).some(([k]) => k !== "—")) {
    rows.push("", [tr("Land"), tr("Betrag ({c})", { c: state.homeCurrency }), tr("Anteil %")].join(sep));
    for (const [n, sum] of byCountry(trip))
      rows.push([csvEscape(n === "—" ? tr("ohne Angabe") : countryDisplay(n)), num(sum), num(total ? sum / total * 100 : 0)].join(sep));
  }
  const perDay = {};
  for (const e of trip.expenses || []) perDay[e.date] = (perDay[e.date] || 0) + e.amountHome;
  rows.push("", [tr("Datum"), tr("Betrag ({c})", { c: state.homeCurrency })].join(sep));
  for (const d of Object.keys(perDay).sort()) rows.push([d, num(perDay[d])].join(sep));
  const travelers = tripTravelers(trip);
  if (travelers.length > 1) {
    const payers = byPayer(trip);
    const fair = total / travelers.length;
    rows.push("", [tr("Person"), tr("Bezahlt ({c})", { c: state.homeCurrency }), tr("Differenz zur Gleichverteilung")].join(sep));
    for (const p of travelers) rows.push([csvEscape(p), num(payers[p] || 0), num((payers[p] || 0) - fair)].join(sep));
  }
  return rows.join("\r\n");
}
function exportSummary() {
  const trip = activeTrip();
  if (!trip || !(trip.expenses || []).length) { toast(tr("Keine Ausgaben zum Exportieren")); return; }
  downloadText("tallyaway-" + slug(trip.name) + "-zusammenfassung-" + todayISO() + ".csv", buildSummaryCSV(trip, true));
}

async function exportBackup() {
  /* stamp first so the backup file itself records when it was made; only
     persist the stamp when the share was not cancelled */
  const stamp = new Date().toISOString();
  const snapshot = { ...state, lastBackupAt: stamp };
  const ok = await downloadText("tallyaway-backup-" + todayISO() + ".json", JSON.stringify(snapshot, null, 2), "application/json");
  if (ok) {
    state.lastBackupAt = stamp;
    state.backupSnoozedUntil = null;
    saveState();
    if (!FORM_VIEWS.includes(state.ui.view)) render(); /* hide the reminder card */
  }
}

/* Backup reminder: shows on the dashboard when there are entries a backup
   does not cover — after 14 days with an old backup, after 3 days without any. */
function backupDue() {
  const exps = state.trips.flatMap(t => t.expenses || []);
  if (!exps.length) return false;
  if (state.backupSnoozedUntil && new Date().toISOString() < state.backupSnoozedUntil) return false;
  if (state.lastBackupAt) {
    const newest = exps.reduce((m, e) => ((e.ts || "") > m ? e.ts : m), "");
    return newest > state.lastBackupAt && (Date.now() - new Date(state.lastBackupAt)) / 864e5 >= 14;
  }
  const oldest = exps.reduce((m, e) => (e.ts && e.ts < m ? e.ts : m), "9999");
  return (Date.now() - new Date(oldest)) / 864e5 >= 3;
}
function snoozeBackup() {
  const d = new Date(); d.setDate(d.getDate() + 7);
  state.backupSnoozedUntil = d.toISOString();
  saveState(); render();
}

/* ----- Cloud backup (Google Drive via the owner's private Apps Script) ----- */
function cloudCfg() {
  try { return JSON.parse(localStorage.getItem(CLOUD_KEY) || "{}") || {}; } catch { return {}; }
}
function setCloudCfg(patch) {
  try { localStorage.setItem(CLOUD_KEY, JSON.stringify({ ...cloudCfg(), ...patch })); } catch (e) { /* quota */ }
}
function setCloudUrl(v) {
  v = (v || "").trim();
  if (v && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)) {
    toast(tr("Adresse prüfen: sie beginnt mit script.google.com und endet auf /exec"));
    return;
  }
  setCloudCfg({ url: v || null });
  toast(tr(v ? "Cloud-Backup eingerichtet ✓" : "Cloud-Backup entfernt"));
  render();
}
/* POST as text/plain: a "simple request" needs no CORS preflight, which the
   Apps Script endpoint could not answer. */
async function cloudUpload(manual) {
  const cfg = cloudCfg();
  if (!cfg.url) { if (manual) toast(tr("Keine Cloud-Adresse eingetragen")); return; }
  if (navigator.onLine === false) { if (manual) toast(tr("Offline – später erneut versuchen")); return; }
  const stamp = new Date().toISOString();
  try {
    const res = await fetch(cfg.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ ...state, lastBackupAt: stamp }),
    });
    const out = await res.json().catch(() => null);
    if (!res.ok || !out || !out.ok) throw new Error((out && out.error) || res.status);
    setCloudCfg({ lastAt: stamp });
    state.lastBackupAt = stamp; /* a cloud backup counts for the reminder too */
    state.backupSnoozedUntil = null;
    saveState();
    if (manual) toast(tr("In Google Drive gesichert ✓"));
    if (!FORM_VIEWS.includes(state.ui.view)) render();
  } catch (e) {
    if (manual) toast(tr("Cloud-Sicherung fehlgeschlagen – Adresse/Verbindung prüfen"));
  }
}
function cloudBackupNow() { toast(tr("Sichere in die Cloud…")); cloudUpload(true); }
/* On boot: upload silently when the cloud copy is behind the local data. */
function autoCloudBackup() {
  const cfg = cloudCfg();
  if (!cfg.url) return;
  const exps = state.trips.flatMap(t => t.expenses || []);
  const newest = exps.reduce((m, e) => ((e.ts || "") > m ? e.ts : m), "");
  if (newest && (!cfg.lastAt || newest > cfg.lastAt)) cloudUpload(false);
}
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9äöüß]+/g, "-").replace(/^-|-$/g, ""); }

let pendingImport = null; /* parsed backup awaiting the replace/merge choice */
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const s = JSON.parse(reader.result);
      if (!s || !Array.isArray(s.trips)) throw new Error("bad format");
      if (!state.trips.length) { applyImport(s, "replace"); return; }
      pendingImport = s;
      openImportSheet(s);
    } catch { toast(tr("Ungültige Backup-Datei")); }
  };
  reader.readAsText(file);
}
function openImportSheet(s) {
  const n = s.trips.length;
  $("#sheetHost").innerHTML = `
  <div class="overlay" onclick="if(event.target===this){pendingImport=null;closeSheet();}">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="h2">${n === 1 ? tr("Backup einspielen (1 Reise)") : tr("Backup einspielen ({n} Reisen)", { n })}</div>
      <p class="muted" style="margin-bottom:14px; line-height:1.5;">${tr("„Hinzufügen\" behält alles auf diesem Gerät und ergänzt die Reisen aus dem Backup (schon vorhandene werden übersprungen). „Ersetzen\" löscht vorher alle Daten auf diesem Gerät.")}</p>
      <div style="display:grid; gap:8px;">
        <button class="btn secondary" onclick="applyImport(pendingImport,'merge')">${tr("Reisen hinzufügen")}</button>
        <button class="btn danger" onclick="applyImport(pendingImport,'replace')">${tr("Alles ersetzen")}</button>
        <button class="btn ghost" onclick="pendingImport=null;closeSheet()">${tr("Abbrechen")}</button>
      </div>
    </div>
  </div>`;
}
function applyImport(s, mode) {
  pendingImport = null; closeSheet();
  const imp = migrateState({ ...defaultState(), ...s, ui: { view: "home" } });
  if (mode === "replace") {
    state = imp;
    saveState(); render(); toast(tr("Backup wiederhergestellt ✓"));
    return;
  }
  let added = 0, skipped = 0;
  for (const t of imp.trips) {
    if (state.trips.some(x => x.id === t.id)) { skipped++; continue; }
    /* the backup may come from a device with another home currency —
       re-derive home amounts so totals stay consistent on this one */
    if (imp.homeCurrency !== state.homeCurrency) {
      for (const e of (t.expenses || [])) {
        e.amountHome = Math.round(toHome(e.amount, e.currency) * 100) / 100;
        e.rate = e.currency === state.homeCurrency ? 1 : Math.round((rateFor(state.homeCurrency) / (rateFor(e.currency) || 1)) * 10000) / 10000;
      }
    }
    state.trips.push(t); added++;
  }
  /* bring the backup's custom categories along (union by id) */
  for (const c of imp.customCategories || [])
    if (!state.customCategories.some(x => x.id === c.id)) state.customCategories.push(c);
  if (!state.activeTripId && state.trips.length) state.activeTripId = state.trips[0].id;
  saveState(); render();
  toast((added === 1 ? tr("1 Reise hinzugefügt") : tr("{n} Reisen hinzugefügt", { n: added })) + (skipped ? tr(", {n} schon vorhanden", { n: skipped }) : "") + " ✓");
}

let lastRenderedView = null;

  const view = state.ui.view;

  /* no trips yet: force the welcome screen — except for trip creation and
     the settings (a fresh install must reach Backup wiederherstellen!) */
  if (!state.trips.length && view !== "add-trip" && view !== "more") { app.innerHTML = viewWelcome(); renderNav(); return; }
  switch (view) {
    case "home": app.innerHTML = viewHome(); break;
    case "expenses": app.innerHTML = viewExpenses(); break;
    case "add": app.innerHTML = viewAdd(); break;
    case "trips": app.innerHTML = viewTrips(); break;
    case "stats": app.innerHTML = viewStats(); break;

    case "map": app.innerHTML = viewMap(); break;
    default: app.innerHTML = viewHome();
  }
  renderNav();
  if (view === "map") initMap();
  /* ongoing trip: start the scrollable chart at "today" (right end) */
  const sp = $('.spark.scroll[data-end]');

     must keep the scroll position */

/* Cross-view jumps (dashboard row → filtered list, stats/trips row → trip

/* ----- Home / dashboard ----- */
function viewHome() {
  const trip = activeTrip();
  if (!trip) return viewWelcome();
  const total = tripTotal(trip);
  const preTotal = tripPreTotal(trip);      /* booked before departure */
  const onTrip = total - preTotal;          /* actually spent on location */
  const elapsed = tripElapsedDays(trip);    /* 0 while the trip is still ahead */
  const budget = trip.budget || 0;
  const pct = budget > 0 ? Math.min(1, total / budget) : 0;
  const left = budget - total;
  const over = budget > 0 && left < 0;
  const r = 58, circ = 2 * Math.PI * r;
  const todaySum = (trip.expenses || []).filter(e => e.date === todayISO()).reduce((s, e) => s + e.amountHome, 0);
  const cats = byCategory(trip);
  const maxCat = cats.length ? cats[0][1] : 1;
  /* the 14-day window only helps while a LONG trip is running (quick "recent
     days" view); for short or past trips it is confusing noise — hide it */
  const ongoing = tripStarted(trip) && (!trip.endDate || trip.endDate >= todayISO());
  const tripSpark = sparkDays(trip, "trip");
  const showSparkToggle = ongoing && tripSpark.length > 20;
  const sparkMode = showSparkToggle && state.ui.sparkMode === "14" ? "14" : "trip";
  const spark = sparkMode === "14" ? sparkDays(trip, "14") : tripSpark;
  const maxSpark = Math.max(1, ...spark.map(d => d.sum));
  const sparkSub = (() => {
    const real = spark.filter(d => d.iso !== "pre");
    if (!real.length) return "";
    if (sparkMode === "14") return tr("Letzte 14 Kalendertage");
    const f = real[0].iso, l = real[real.length - 1].iso;
    const D = (iso, withYear) => { const [y, m, dd] = iso.split("-").map(Number); return new Date(y, m - 1, dd).toLocaleDateString(LOCALE(), { day: "numeric", month: "short", ...(withYear ? { year: "numeric" } : {}) }); };
    const curY = todayISO().slice(0, 4);
    const sameMonth = appLang() === "de" && f.slice(0, 7) === l.slice(0, 7);
    const range = (sameMonth ? Number(f.slice(8)) + "." : D(f, f.slice(0, 4) !== l.slice(0, 4)))
      + "–" + D(l, f.slice(0, 4) !== curY || l.slice(0, 4) !== curY);
    return tr("Reisezeitraum: {r} · {d}", { r: range, d: real.length === 1 ? tr("1 Tag") : tr("{n} Tage", { n: real.length }) });
  })();
  const payers = byPayer(trip);
  const travelers = tripTravelers(trip);
  const showSplit = travelers.length > 1 && (trip.expenses || []).length > 0;

  return `
  <div class="topbar">

    </div>

    <div style="font-size:22px; flex:none;">💾</div>
    <div style="flex:1;" class="muted">${tr(state.lastBackupAt ? "Dein letztes Backup ist über 2 Wochen her." : "Noch kein Backup erstellt.")} ${tr("Sichere deine Daten.")}</div>
    <button class="btn secondary" style="width:auto; padding:10px 14px; font-size:13px; flex:none;" onclick="exportBackup()">${tr("Backup")}</button>
    <button class="btn ghost" style="width:auto; padding:10px 4px; font-size:13px; flex:none;" onclick="snoozeBackup()">${tr("Später")}</button>
  </div>` : ""}

  <div class="card">
    <div class="ring-wrap">
      <div class="ring">
        <svg width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="${tr("Ausgaben nach Kategorie")}">
          <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--bg)" stroke-width="11"/>
          ${(() => {
            /* donut segments per category (owner request), same colors as the
               breakdown bars below; with a budget the segments fill only the
               spent fraction of the circle, the empty track = remaining budget */
            if (!total) return "";
            const usedFrac = budget > 0 ? pct : 1;
            const segs = [];
            let grey = 0;
            for (const [cid, sum] of cats) { if (CAT_COLORS[cid]) segs.push([CAT_COLORS[cid], sum]); else grey += sum; }

              const len = Math.max(0, share - GAP);

        ${elapsed === 0

        ${preTotal > 0 ? `<div class="kpi"><div class="v">${fmt(preTotal)}</div><div class="l">${tr("vorab gebucht ({p} % der Kosten)", { p: Math.round(preTotal / total * 100) })}</div></div>` : ""}
        <div class="kpi"><div class="v">${fmt(todaySum)}</div><div class="l">${tr("heute")}</div></div>
        ${(trip.expenses || []).length ? (() => {

          const topCat = cats.length ? catById(cats[0][0]) : null;

        })() : ""}
        ${(() => {
          if (!trip.endDate || elapsed === 0) return ""; /* before departure the countdown above says it */

/* ----- Expense list ----- */
let expFilter = { q: "", cat: null, country: null }; /* transient; reset on trip switch */
function expenseMatches(e) {
  if (expFilter.cat && e.category !== expFilter.cat) return false;
  if (expFilter.country && (e.country || null) !== expFilter.country) return false;
  const q = expFilter.q.trim().toLowerCase();
  if (!q) return true;
  return (e.note || "").toLowerCase().includes(q)
    || catById(e.category).name.toLowerCase().includes(q)
    || (e.payer || "").toLowerCase().includes(q);
}
function expListHTML(trip) {
  const exps = tripExpenses(trip).filter(expenseMatches);
  if (!exps.length) return `<div class="card empty"><div class="e">🔍</div>${tr("Keine Treffer.")}</div>`;
  const groups = {};
  for (const e of exps) (groups[e.date] = groups[e.date] || []).push(e);
  const dates = Object.keys(groups).sort().reverse();
  return dates.map(d => {
    const daySum = groups[d].reduce((s, e) => s + e.amountHome, 0);
    return `<div class="day-head"><span>${dateLabel(d)}</span><span>${fmtShort(daySum)}</span></div>` +

}

/* ----- Add / edit expense ----- */
function startAdd() {
  if (!state.trips.length) { go("add-trip"); return; }
  editingExpenseId = null;
  catExpanded = false;
  addDetailsOpen = false;
  const trip = activeTrip();
  const last = (trip.expenses || [])[trip.expenses.length - 1];
  /* currency default: last used in this trip → trip's destination currency → home */
  draft = {
    amountStr: "", sign: 1,
    currency: last ? last.currency : (trip.currency || state.homeCurrency),
    category: null, note: "", date: todayISO(),
    payer: last ? (last.payer || tripTravelers(trip)[0]) : tripTravelers(trip)[0],
    country: defaultExpCountry(trip, last),
    location: null,
  };
  go("add");
}
/* Country default: last-used in this trip wins (border-hopping continuity),
   otherwise the first destination. null for trips without destinations. */
function defaultExpCountry(trip, last) {
  const cs = tripCountries(trip);
  if (!cs.length) return null;
  if (last && last.country && cs.some(c => c.name === last.country)) return last.country;
  return cs[0].name;
}
function editExpense(id) {

    currency: e.currency, category: e.category, note: e.note || "", date: e.date,
    payer: e.payer || tripTravelers(trip)[0], rate: e.rate,

  go("add");
}
function draftAmount() { return parseFloat((draft.amountStr || "0").replace(",", ".")) || 0; }

function convText() {
  const amt = draftAmount();

  if (draft.sign === -1) return `<span style="color:var(--danger); font-weight:650;">↩ ${tr("Erstattung")}</span>${conv ? " · " + conv : ""}`;

      ${expanded ? `<button class="cat-cell" style="border:1.5px dashed var(--line); background:transparent; box-shadow:none;" onclick="openNewCatSheet()"><div class="e">＋</div><div class="n">${tr("Eigene")}</div></button>` : ""}

    <button class="chip ${draft.date === yesterdayISO() ? "on" : ""}" onclick="setDraftDate(yesterdayISO())">${tr("Gestern")}</button>

  <button class="btn ghost" style="padding:8px; margin-bottom:8px;" onclick="toggleAddDetails()">${tr(details ? "Weniger Details ▴" : "Mehr Details ▾")}</button>` : ""}
  ${details ? `
  ${tripCountries(trip).length > 1 ? `<div class="muted" style="font-weight:600; margin:2px 2px 8px;">${tr("Land")}</div>
  <div class="payer-row">
    ${tripCountries(trip).map(c => `<button class="chip ${draft.country === c.name ? "on" : ""}" onclick="setDraftCountry('${esc(c.name)}')">${countryFlag(c.name)}${esc(countryDisplay(c.name))}</button>`).join("")}
  </div>` : ""}
  ${editingExpenseId && state.trips.length > 1 ? `<label class="field"><span>${tr("Reise (zum Verschieben ändern)")}</span>
    <select onchange="draft.tripId=this.value">${state.trips.map(t => `<option value="${t.id}" ${t.id === draft.tripId ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select></label>` : ""}` : ""}

  ${editingExpenseId ? `<button class="btn danger" style="margin-top:4px;" onclick="deleteExpense()">${tr("Ausgabe löschen")}</button>` : ""}`;
}
let addDetailsOpen = false; /* "Mehr Details" section; auto-opens when the
  expense already carries a refund so nothing hides silently */
function toggleAddDetails() { addDetailsOpen = !addDetailsOpen; render(); }
function cancelAdd() {

}
function toggleRefund() { draft.sign = draft.sign === -1 ? 1 : -1; render(); }
function setDraftDate(v) { draft.date = v || todayISO(); render(); }
let catExpanded = false; /* category grid collapsed to top-8 by default */

/* ----- Optional location on an expense: one tap grabs the GPS position
   (works offline); the place name resolves via OpenStreetMap when online ----- */
function locRowHTML() {
  const l = draft && draft.location;
  const label = l && l.label ? l.label : "";
  const hasCoords = l && typeof l.lat === "number";
  return `<input id="locInput" value="${esc(label)}" placeholder="${tr("z. B. Strandbar, Altstadt …")}"
      autocomplete="off" oninput="locInputChanged(this.value)" style="flex:1; min-width:0;">
    ${hasCoords ? `<button class="icon-btn" style="flex:none;" onclick="openInMaps(${l.lat},${l.lon})" aria-label="Map">${MAP_ICON}</button>
    <button class="icon-btn" style="flex:none;" onclick="clearLocation()" aria-label="Remove">✕</button>`
    : `<button class="icon-btn" style="flex:none;" onclick="geocodeLocation()" aria-label="Search">🔍</button>`}
    <button class="icon-btn" style="flex:none;" onclick="captureLocation()" aria-label="GPS">📍</button>`;
}
/* typing must never trigger a re-render (focus loss) — draft only */
function locInputChanged(v) {
  v = v.trim();
  if (!draft.location && v) { draft.location = { lat: null, lon: null, label: v }; return; }
  if (draft.location) {
    draft.location.label = v || null;
    if (!v && draft.location.lat == null) draft.location = null;
  }
}
function paintLocRow() {
  const row = $("#locRow");
  if (row && document.activeElement !== $("#locInput")) row.innerHTML = locRowHTML();
}
function captureLocation() {
  if (!navigator.geolocation) { toast(tr("Standort auf diesem Gerät nicht verfügbar")); return; }
  const row = $("#locRow");
  if (row) row.innerHTML = `<span class="muted" style="padding:9px 2px;">${tr("📍 Standort wird ermittelt…")}</span>`;
  navigator.geolocation.getCurrentPosition((pos) => {
    /* keep a label the user already typed — GPS only adds the coordinates */
    const typed = draft.location && draft.location.label;
    draft.location = { lat: Math.round(pos.coords.latitude * 1e5) / 1e5, lon: Math.round(pos.coords.longitude * 1e5) / 1e5, label: typed || null };
    paintLocRow();
    resolvePlaceName();
  }, () => { toast(tr("Standort nicht verfügbar – Berechtigung erteilt?")); paintLocRow(); },
  { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
}
function clearLocation() { if (draft) draft.location = null; paintLocRow(); }
async function resolvePlaceName() {
  const l = draft && draft.location;
  if (!l || l.label) return;
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${l.lat}&lon=${l.lon}&accept-language=de&zoom=14`);
    const d = await res.json();
    const a = d.address || {};
    const label = a.city || a.town || a.village || a.suburb || a.municipality || d.name || null;
    /* patch only the location row — never re-render the form from background */
    if (label && draft && draft.location === l) { l.label = label; paintLocRow(); }
  } catch (e) { /* offline – Koordinaten bleiben, Name kommt ggf. beim Bearbeiten */ }
}
function openInMaps(lat, lon) { window.open("https://maps.google.com/?q=" + lat + "," + lon, "_blank"); }
/* Forward geocoding for AFTER-the-fact entries: typing "Danialand Agadir" and
   tapping 🔍 finds the coordinates, so the place shows on the maps. Biased
   with the expense's country for better hits; retries without it. */
async function geocodeLocation() {
  const l = draft && draft.location;
  const q = l && l.label;
  if (!q) { toast(tr("Erst einen Ort eintippen, dann 🔍")); return; }
  const attempts = [draft.country ? q + ", " + draft.country : null, q].filter(Boolean);
  try {
    toast(tr("Suche „{q}“ …", { q }));
    for (const query of attempts) {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=de&q=${encodeURIComponent(query)}`);
      const d = await res.json();
      if (d.length) {
        l.lat = Math.round(parseFloat(d[0].lat) * 1e5) / 1e5;
        l.lon = Math.round(parseFloat(d[0].lon) * 1e5) / 1e5;
        /* adopt the official place name (e.g. "Aéroport Agadir Al Massira")
           instead of the user's rough search text; retyping keeps the pin */
        const nice = d[0].name || (d[0].display_name || "").split(",")[0].trim();
        if (nice) l.label = nice;
        paintLocRow();
        toast(tr("Gefunden: {n} ✓", { n: nice || q }));
        return;
      }
    }
    toast(tr("Nicht gefunden – genauer eintippen (z. B. mit Stadt)"));
  } catch (e) { toast(tr("Suche fehlgeschlagen – offline?")); }
}

/* ----- Maps: Leaflet + OpenStreetMap, lazy-loaded ONLY when a map view
   opens — the core app stays dependency-free and offline-first.
   Two scopes: "trip" (active trip, from Übersicht) and "all" (world map
   across every trip, from Statistik). ----- */
let mapScope = "trip";
let _leafletLoading = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  if (_leafletLoading) return _leafletLoading;
  _leafletLoading = new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);
    const s = document.createElement("script");
    s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.onload = resolve;
    s.onerror = () => { _leafletLoading = null; reject(new Error("offline")); };
    document.head.appendChild(s);
  });
  return _leafletLoading;
}
function hasCoordsIn(exps) { return (exps || []).some(x => x.location && typeof x.location.lat === "number"); }
function openMapMaybe() {
  const t = activeTrip();
  if (!t || !hasCoordsIn(t.expenses)) { toast(tr("Noch keine Orte erfasst – nutze 📍 beim Eintragen")); return; }
  mapScope = "trip";
  go("map", state.ui.view);
}
function openWorldMap() {
  if (!state.trips.some(t => hasCoordsIn(t.expenses))) { toast(tr("Noch keine Orte erfasst – nutze 📍 beim Eintragen")); return; }
  mapScope = "all";
  go("map", state.ui.view);
}
function viewMap() {
  const trip = activeTrip();
  return `
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:10px; min-width:0;">
      <button class="icon-btn" onclick="goBack()" aria-label="${tr("Zurück")}" style="font-size:22px;">‹</button>
      <div class="title">${tr(mapScope === "all" ? "Weltkarte" : "Karte")}</div>
    </div>
    ${mapScope === "all" ? `<div class="trip-chip" style="pointer-events:none;">${tr("Alle Reisen")}</div>`
      : `<button class="trip-chip" onclick="go('trips')">${esc(trip.name)} ▾</button>`}
  </div>
  <div id="map" style="height:calc(100vh - 210px); border-radius:var(--radius); box-shadow:var(--shadow); background:var(--card);"></div>
  <div class="muted" style="text-align:center; margin-top:8px;">${tr("Marker antippen für Details · Karten: © OpenStreetMap")}</div>`;
}
async function initMap() {
  const el = $("#map");
  if (!el) return;
  try { await loadLeaflet(); } catch (e) {
    el.innerHTML = `<div class="empty"><div class="e">🗺</div>${tr("Die Karte braucht eine Internetverbindung.")}</div>`;
    return;
  }
  const trips = mapScope === "all" ? state.trips : [activeTrip()].filter(Boolean);
  const map = L.map(el);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);
  const bounds = [];
  for (const t of trips) {
    for (const x of (t.expenses || [])) {
      if (!x.location || typeof x.location.lat !== "number") continue;
      const c = catById(x.category);
      L.marker([x.location.lat, x.location.lon]).addTo(map)
        .bindPopup(`${mapScope === "all" ? "<b>" + esc(t.name) + "</b><br>" : ""}${c.icon} ${esc(x.note || tr(c.name))}<br><b>${fmt(x.amountHome)}</b> · ${dateLabel(x.date)}${x.location.label ? "<br>📍 " + esc(x.location.label) : ""}`);
      bounds.push([x.location.lat, x.location.lon]);
    }
  }
  if (bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: mapScope === "all" ? 6 : 14 });
  else map.setView([20, 0], 2);
}
function setDraftCountry(n) { draft.country = n; render(); }
function setCur(c) {
  draft.currency = c;
  /* multi-destination trips: a currency belonging to exactly one destination
     also selects that country (no extra tap on border hops) */
  const matches = tripCountries(activeTrip()).filter(x => x.cur === c);
  if (matches.length === 1) draft.country = matches[0].name;
  /* in edit mode keep the rate field consistent with the chosen currency:
     original currency → its frozen rate; other currency → current live rate */
  if (editingExpenseId) {
    const orig = (activeTrip().expenses || []).find(x => x.id === editingExpenseId);
    draft.rate = orig && orig.currency === c ? orig.rate
      : (c === state.homeCurrency ? 1 : Math.round(rateFor(state.homeCurrency) / (rateFor(c) || 1) * 10000) / 10000);
  }
  render();
}
function setCat(c) { draft.category = c; render(); }
function setPayer(p) { draft.payer = p; render(); }
function saveExpense() {
  const amt = draftAmount() * (draft.sign === -1 ? -1 : 1); /* refunds are negative */
  if (draftAmount() <= 0) { toast(tr("Bitte Betrag eingeben")); return; }
  if (!draft.category) { toast(tr("Bitte Kategorie wählen")); return; }
  const trip = activeTrip();
  let rate = draft.currency === state.homeCurrency ? 1 : (rateFor(state.homeCurrency) / (rateFor(draft.currency) || 1));
  let rateSource = draft.currency === state.homeCurrency ? "live" : state.rates.source;
  /* Edits keep the frozen entry rate (or the user's manual correction) —
     a fresh live rate only applies when the currency was changed. A manual
     correction becomes authoritative: mark it "live" so the one-time
     fallback upgrade never overwrites it. */
  const orig = editingExpenseId ? (trip.expenses || []).find(x => x.id === editingExpenseId) : null;
  if (orig && orig.currency === draft.currency && draft.rate > 0) {
    rate = draft.rate;
    rateSource = Math.abs(rate - orig.rate) > 1e-9 ? "live" : orig.rateSource;
  }
  const rec = {
    id: editingExpenseId || uid(),
    ts: new Date().toISOString(),
    /* spending date comes from the date row (defaults to today); ts stays "now" */
    date: draft.date || todayISO(),
    amount: amt,
    currency: draft.currency,
    amountHome: Math.round(amt * rate * 100) / 100,
    rate: Math.round(rate * 10000) / 10000,
    category: draft.category,
    note: draft.note.trim(),
    payer: draft.payer,
    country: draft.country || null,
    location: draft.location || null,
    rateSource,
  };
  let movedTo = null;
  if (editingExpenseId) {
    delete rec.ts; /* keep the original creation timestamp on edits */
    const i = trip.expenses.findIndex(x => x.id === editingExpenseId);
    if (i >= 0) {
      const updated = { ...trip.expenses[i], ...rec };
      const target = draft.tripId && draft.tripId !== trip.id ? state.trips.find(t => t.id === draft.tripId) : null;
      if (target) {
        trip.expenses.splice(i, 1);
        target.expenses.push(updated);
        checkBudgetWarning(target);
        movedTo = target.name;
      } else {
        trip.expenses[i] = updated;
      }
    }
  } else {
    trip.expenses.push(rec);
  }
  if (!state.recentCurrencies.includes(draft.currency)) { state.recentCurrencies.push(draft.currency); if (state.recentCurrencies.length > 6) state.recentCurrencies.shift(); }
  const wasEditing = !!editingExpenseId;
  editingExpenseId = null;
  toast(movedTo ? tr("Nach „{n}“ verschoben ✓", { n: movedTo }) : tr(wasEditing ? "{x} gespeichert ✓" : "{x} erfasst ✓", { x: fmt(rec.amountHome) }));
  checkBudgetWarning(trip); /* after the confirmation toast — a crossing warning replaces it */
  saveState();
  go("home");
}
let lastDeleted = null; /* {tripId, exp} — kept for the undo toast */
function deleteExpense() {
  if (!editingExpenseId) return;
  const trip = activeTrip();
  const exp = (trip.expenses || []).find(x => x.id === editingExpenseId);
  trip.expenses = trip.expenses.filter(x => x.id !== editingExpenseId);
  lastDeleted = exp ? { tripId: trip.id, exp } : null;
  editingExpenseId = null;
  checkBudgetWarning(trip); /* re-arms the warning bracket after deletes */
  saveState(); go("expenses");
  toastAction(tr("Gelöscht"), tr("Rückgängig"), undoDelete, 6000);
}
function undoDelete() {
  if (!lastDeleted) return;
  const trip = state.trips.find(t => t.id === lastDeleted.tripId);
  if (trip) {
    trip.expenses.push(lastDeleted.exp);
    saveState(); render();
    toast(tr("Wiederhergestellt ✓"));
    checkBudgetWarning(trip);
  }
  lastDeleted = null;
}

/* ----- Cross-trip statistics ----- */
let statsYear = null; /* null = all years; transient */
function setStatsYear(y) { statsYear = y; render(); }
function viewStats() {
  const years = [...new Set(state.trips.map(t => (t.startDate || "").slice(0, 4)).filter(Boolean))].sort().reverse();
  const trips = state.trips.filter(t => !statsYear || (t.startDate || "").startsWith(statsYear))
    .slice().sort((a, b) => (b.startDate || "").localeCompare(a.startDate || ""));
  const total = trips.reduce((s, t) => s + tripTotal(t), 0);
  const days = trips.reduce((s, t) => s + tripDays(t), 0);
  const nCountries = new Set(trips.flatMap(t => tripCountries(t).map(c => c.name))).size;
  const topTrip = trips.length ? trips.reduce((a, t) => tripTotal(t) > tripTotal(a) ? t : a) : null;
  const maxTotal = Math.max(1, ...trips.map(tripTotal));
  const cats = {};
  for (const t of trips) for (const e of t.expenses || []) cats[e.category] = (cats[e.category] || 0) + e.amountHome;
  const catRows = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  const maxCat = catRows.length ? catRows[0][1] : 1;
  return `
  <div class="topbar"><div class="title">${tr("Statistik")}</div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="icon-btn" onclick="openWorldMap()" aria-label="${tr("Weltkarte")}">${MAP_ICON}</button>
      <button class="icon-btn" onclick="openSettings()" aria-label="${tr("Einstellungen")}">⚙️</button>
    </div>
  </div>
  <div class="cur-row" style="padding-top:2px;">
    <button class="chip ${!statsYear ? "on" : ""}" onclick="setStatsYear(null)">${tr("Alle")}</button>
    ${years.map(y => `<button class="chip ${statsYear === y ? "on" : ""}" onclick="setStatsYear('${y}')">${y}</button>`).join("")}
  </div>
  ${trips.length ? `
  <div class="card">
    <div class="kpis" style="grid-template-columns:1fr 1fr;">
      <div class="kpi"><div class="v">${fmtShort(total)}</div><div class="l">${trips.length === 1 ? tr("Gesamt (1 Reise)") : tr("Gesamt ({n} Reisen)", { n: trips.length })}</div></div>
      <div class="kpi"><div class="v">${fmtShort(total / trips.length)}</div><div class="l">${tr("Ø pro Reise")}</div></div>
      <div class="kpi"><div class="v">${fmtShort(days ? total / days : 0)}</div><div class="l">${tr("Ø pro Reisetag ({n} Tage)", { n: days })}</div></div>
      <div class="kpi"><div class="v">${nCountries}</div><div class="l">${tr(nCountries === 1 ? "Land besucht" : "Länder besucht")}</div></div>
      ${topTrip ? `<div class="kpi" style="grid-column:1 / -1;"><div class="v">${fmtShort(tripTotal(topTrip))}</div><div class="l">${tr("teuerste Reise: {n}", { n: esc(topTrip.name) })}</div></div>` : ""}
    </div>
  </div>
  <div class="card">
    <div class="h2">${tr("Pro Reise")}</div>
    ${trips.map(t => {
      const sum = tripTotal(t);
      const d = tripDays(t);
      /* comparison view: bar + total + the one comparison number (Ø/Tag);
         dates/day counts live on the Reisen page — deliberately no duplicate */
      return `<div class="cat-row" onclick="switchTrip('${t.id}','stats')" style="cursor:pointer;">
        <div class="cat-mid"><div class="cat-name">${esc(t.name)} <span class="muted" style="font-weight:400;">· Ø ${fmtShort(d ? sum / d : 0)}${tr("/Tag")}</span></div>
          <div class="cat-track"><div class="cat-fill" style="width:${Math.max(3, Math.round(sum / maxTotal * 100))}%"></div></div></div>
        <div class="cat-amt">${fmtShort(sum)}</div></div>`;
    }).join("")}
    <div class="muted" style="margin-top:8px;">${tr("Antippen wählt die Reise aus und öffnet ihre Übersicht.")}</div>
  </div>
  ${!statsYear && years.length > 1 ? `<div class="card">
    <div class="h2">${tr("Pro Jahr")}</div>
    ${years.map(y => {
      const sum = state.trips.filter(t => (t.startDate || "").startsWith(y)).reduce((s, t) => s + tripTotal(t), 0);
      return `<div class="list-item"><b>${y}</b><div style="font-weight:750">${fmtShort(sum)}</div></div>`;
    }).join("")}
  </div>` : ""}
  ${catRows.length ? (() => {
    /* only shares >= 5% by default; the long tail expands on demand */
    const major = catRows.filter(([, sum]) => total && sum / total >= 0.05);
    const minor = catRows.filter(([, sum]) => !total || sum / total < 0.05);
    const shown = statCatsExpanded || !major.length ? catRows : major;
    const row = ([cid, sum]) => {
      const c = catById(cid);
      return `<div class="cat-row" onclick="statsCatToast('${cid}')" style="cursor:pointer;">
        <div class="cat-ico">${c.icon}</div>
        <div class="cat-mid"><div class="cat-name">${esc(tr(c.name))} <span class="muted" style="font-weight:400;">· ${total ? Math.round(sum / total * 100) : 0} %</span></div>
          <div class="cat-track"><div class="cat-fill" style="width:${Math.max(3, Math.round(sum / maxCat * 100))}%; background:${catColor(cid)};"></div></div></div>
        <div class="cat-amt">${fmtShort(sum)}</div></div>`;
    };
    return `<div class="card">
    <div class="h2">${tr("Nach Kategorie")}</div>
    ${shown.map(row).join("")}
    ${minor.length && major.length ? `<button class="btn ghost" style="padding:8px; margin-top:2px;" onclick="toggleStatCats()">${statCatsExpanded ? tr("Weniger anzeigen ▴") : tr("Weitere {n} Kategorien ▾", { n: minor.length })}</button>` : ""}
    <div class="muted" style="margin-top:6px;">${tr("Antippen zeigt Anteil und Anzahl der Einträge.")}</div>
  </div>`;
  })() : ""}` : `<div class="card empty"><div class="e">📈</div>${tr("Keine Reisen in diesem Zeitraum.")}</div>`}`;
}
let statCatsExpanded = false; /* transient */
function toggleStatCats() { statCatsExpanded = !statCatsExpanded; render(); }
/* Detail toast for a stats category row (same interactivity as the trip bars). */
function statsCatToast(cid) {
  const trips = state.trips.filter(t => !statsYear || (t.startDate || "").startsWith(statsYear));
  let sum = 0, n = 0, total = 0;
  for (const t of trips) for (const e of t.expenses || []) {
    total += e.amountHome;
    if (e.category === cid) { sum += e.amountHome; n++; }
  }
  toast(tr(n === 1 ? "{c}: {x} · {p} % · 1 Eintrag" : "{c}: {x} · {p} % · {n} Einträge", { c: tr(catById(cid).name), x: fmtShort(sum), p: total ? Math.round(sum / total * 100) : 0, n }));
}
